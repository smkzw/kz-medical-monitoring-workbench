<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受试者医学旅程（合成演示）</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pj-app" data-kz-theme="kangzhe-light">
  <a class="pj-skip" href="#pj-main">跳到主内容</a>

  <header class="pj-chrome" role="banner">
    <div class="pj-chrome__brand">
      <div class="pj-logo" data-qc-id="logo-full">
        <img src="../aemh_audience_workbench/assets/logo_bot.svg" width="158" height="33" alt="CMS 康哲药业">
      </div>
      <div class="pj-chrome__titles">
        <p class="pj-chrome__eyebrow">医学监查 · 受试者医学旅程 · 合成演示数据</p>
        <h1 class="pj-chrome__title">受试者医学旅程</h1>
      </div>
    </div>
    <div class="pj-chrome__meta" id="pj-header-meta" aria-live="polite"></div>
  </header>

  <aside class="pj-boundary" role="note" aria-label="使用说明">
    <p><strong>AI 已完成风险梳理，本页用于查阅与定位。</strong>浏览、筛选与选中不会改变数据或风险状态。</p>
    <p id="pj-disclaimer" class="pj-boundary__disclaimer"></p>
  </aside>

  <div id="pj-error" class="pj-error" role="alert" hidden>
    <h2 class="pj-error__title">受试者医学旅程暂时无法打开</h2>
    <p class="pj-error__body" id="pj-error-body"></p>
    <p class="pj-error__hint">请确认所需数据文件完整后重新打开。系统不会在缺少数据时显示推测或临时结果。</p>
  </div>

  <div id="pj-shell" class="pj-shell" hidden>
    <div class="pj-toolbar" aria-label="时间与显示控制">
      <div class="pj-toolbar__row">
        <label class="pj-field">
          <span class="pj-field__label">时间显示</span>
          <select id="pj-axis-mode" class="pj-select">
            <option value="actual_date">实际日期</option>
            <option value="study_day">研究日（派生标签）</option>
          </select>
        </label>
        <label class="pj-field">
          <span class="pj-field__label">开始日期</span>
          <input id="pj-window-start" class="pj-input" type="date">
        </label>
        <label class="pj-field">
          <span class="pj-field__label">结束日期</span>
          <input id="pj-window-end" class="pj-input" type="date">
        </label>
        <button type="button" class="pj-btn pj-btn--primary" id="pj-window-apply">查看此时间段</button>
        <button type="button" class="pj-btn" id="pj-window-reset">显示全部</button>
        <label class="pj-field pj-field--range">
          <span class="pj-field__label">时间轴疏密</span>
          <input id="pj-zoom" class="pj-range" type="range" min="8" max="28" step="1" value="14" aria-valuetext="中等密度">
        </label>
        <label class="pj-check">
          <input id="pj-risk-first" type="checkbox" checked>
          <span>优先显示中高风险</span>
        </label>
      </div>
      <p class="pj-toolbar__note" id="pj-window-note"></p>
    </div>

    <div class="pj-tabs" role="tablist" aria-label="受试者旅程同步视图">
      <button type="button" class="pj-tab" role="tab" id="pj-tab-journey" data-tab="journey" aria-controls="pj-panel-journey" aria-selected="true">旅程总览</button>
      <button type="button" class="pj-tab" role="tab" id="pj-tab-metrics" data-tab="metrics" aria-controls="pj-panel-metrics" aria-selected="false">指标趋势</button>
      <button type="button" class="pj-tab" role="tab" id="pj-tab-events" data-tab="events" aria-controls="pj-panel-events" aria-selected="false">事件明细</button>
      <button type="button" class="pj-tab" role="tab" id="pj-tab-risks" data-tab="risks" aria-controls="pj-panel-risks" aria-selected="false">风险依据</button>
    </div>

    <main id="pj-main" class="pj-main" tabindex="-1">
      <section id="pj-panel-journey" class="pj-panel" role="tabpanel" aria-labelledby="pj-tab-journey"></section>
      <section id="pj-panel-metrics" class="pj-panel" role="tabpanel" aria-labelledby="pj-tab-metrics" hidden></section>
      <section id="pj-panel-events" class="pj-panel" role="tabpanel" aria-labelledby="pj-tab-events" hidden></section>
      <section id="pj-panel-risks" class="pj-panel" role="tabpanel" aria-labelledby="pj-tab-risks" hidden></section>
    </main>
  </div>

  <div id="pj-drawer-root" class="pj-drawer-root" hidden>
    <div class="pj-drawer-backdrop" id="pj-drawer-backdrop" tabindex="-1"></div>
    <aside class="pj-drawer" id="pj-drawer" role="dialog" aria-modal="true" aria-labelledby="pj-drawer-title" tabindex="-1">
      <header class="pj-drawer__head">
        <h2 class="pj-drawer__title" id="pj-drawer-title">详情与来源</h2>
        <button type="button" class="pj-btn pj-btn--ghost" id="pj-drawer-close" aria-label="关闭详情与来源">关闭</button>
      </header>
      <div class="pj-drawer__body" id="pj-drawer-body"></div>
    </aside>
  </div>

  <footer class="pj-footer">
    <p class="pj-footer__id">产品中心-医学部｜2026年08月</p>
    <p class="pj-footer__mark">合成演示数据 · 非生产用途</p>
  </footer>

  <script src="../aemh_audience_workbench/data/mm_r1_data.js"></script>
  <script src="data/journey_fixture.js"></script>
  <script src="app.js"></script>
</body>
</html>
